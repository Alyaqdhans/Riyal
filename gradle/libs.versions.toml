[versions]
# AGP 9.2.1: built-in Kotlin (no standalone kotlin-android/compose plugins),
# required by compose material3 1.5.0-alpha29 (needs AGP >= 9.1 and compileSdk 37).
agp = "9.2.1"
# The Kotlin the app is compiled with. AGP's built-in Kotlin asks for KGP 2.2.10 at least,
# and the Compose compiler plugin's Kotlin BOM raises it to this version, so the compiler
# and the plugin always match. 2.4 because LazyColumnScrollbar 3.0 is built with 2.4.20.
kotlinComposePlugin = "2.4.21"
coreKtx = "1.17.0"
junit = "4.13.2"
json = "20250107"
lifecycle = "2.10.0"
appcompat = "1.7.1"
material = "1.14.0"
# The tabs are plain fragments that MainActivity keeps and slides itself; the version
# the rest of the graph already resolves.
fragment = "1.6.2"
# The version the rest of the graph already resolves (appcompat 1.7 and the chart
# library pull it in); declared so screens can use BackHandler directly.
activityCompose = "1.8.2"
splashscreen = "1.0.1"
composeMaterial3 = "1.5.0-alpha29"
composeIconsCore = "1.7.8"
vico = "3.2.3"
# Release notes are markdown, drawn by Markwon as ytdlnis draws its own. 4.6.2 is
# Markwon's last release; it is Java, so the Kotlin version does not reach it.
markwon = "4.6.2"
# The scroll thumb on every list: drag it to run down the list. 3.0 is the release whose
# thumb no longer jumps on lists with content padding; it is built with Kotlin 2.4.20.
lazyColumnScrollbar = "3.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "composeIconsCore" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }
lazycolumnscrollbar = { group = "com.github.nanihadesuka.LazyColumnScrollbar", name = "lazycolumnscrollbar", version.ref = "lazyColumnScrollbar" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposePlugin" }
